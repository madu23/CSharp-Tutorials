<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container-fluid">
      <div class="row vh-100">
        <!-- Sidebar -->
        <nav
          class="col-md-3 col-lg-2 bg-light d-flex flex-column align-items-center py-3"
        >
          <img src="Images/logo.png" alt="Logo" class="mb-3 w-50" />

          <button
            class="btn w-100 text-start d-flex align-items-center py-2 active"
          >
            <img src="Images/dashboard-icon.svg" alt="Dashboard" class="me-2" />
            Dashboard
          </button>

          <button class="btn w-100 text-start d-flex align-items-center py-2">
            <img src="Images/food-icon.svg" alt="Menu" class="me-2" />
            Menu
          </button>

          <button class="btn w-100 text-start d-flex align-items-center py-2">
            <img src="Images/customer-icon.svg" alt="Customer" class="me-2" />
            Customers
          </button>

          <button class="btn w-100 text-start d-flex align-items-center py-2">
            <img src="Images/order-icon.svg" alt="Order" class="me-2" />
            Orders
          </button>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 col-lg-10 p-4 bg-light">
          <!-- Navbar -->
          <nav
            class="navbar navbar-expand-lg navbar-light bg-white rounded shadow-sm px-3"
          >
            <input
              type="text"
              class="form-control me-3"
              placeholder="Search Employee ID"
            />
            <div>
              <img
                src="Images/Notification.svg"
                alt="Notification"
                class="me-3"
              />
              <img
                src="Images/profile.jpg"
                alt="Profile"
                class="rounded-circle"
                width="40"
              />
            </div>
          </nav>

          <!-- Hero Section -->
          <section class="mt-4">
            <!-- Cards -->
            <!-- Cards Section -->
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3">
              <div class="col">
                <div class="card text-center shadow-sm p-3">
                  <img
                    src="Images/orders-icon.svg"
                    alt="Orders"
                    class="mb-2"
                    width="30"
                  />
                  <h6>Total Orders</h6>
                  <p class="fw-bold">1,750</p>
                </div>
              </div>

              <div class="col">
                <div class="card text-center shadow-sm p-3">
                  <img
                    src="Images/delivered-icon.svg"
                    alt="Delivered"
                    class="mb-2"
                    width="30"
                  />
                  <h6>Total Delivered</h6>
                  <p class="fw-bold">567</p>
                </div>
              </div>

              <div class="col">
                <div class="card text-center shadow-sm p-3">
                  <img
                    src="Images/revenue-icon.svg"
                    alt="Revenue"
                    class="mb-2"
                    width="30"
                  />
                  <h6>Total Revenue</h6>
                  <p class="fw-bold">N1,290,750</p>
                </div>
              </div>

              <div class="col">
                <div class="card text-center shadow-sm p-3">
                  <img
                    src="Images/menu-icon.svg"
                    alt="Food"
                    class="mb-2"
                    width="30"
                  />
                  <h6>Total Menu</h6>
                  <p class="fw-bold">125</p>
                </div>
              </div>
            </div>

            <!-- Dashboard Content (Table & Graph) -->
            <!-- Dashboard Content (Table & Graph) -->
            <div class="row g-3 mt-4">
              <!-- Employee Details Table -->
              <div class="col-12 col-lg-6">
                <div class="card shadow-sm p-3">
                  <h5 class="card-title">Employee Details</h5>
                  <table class="table table-striped">
                    <thead class="table-dark">
                      <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Designation</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td>#1454</td>
                        <td>Oluwafunmilayo</td>
                        <td>Lemboye</td>
                        <td>System Admin</td>
                      </tr>
                      <tr>
                        <td>#1455</td>
                        <td>Jane</td>
                        <td>Doe</td>
                        <td>HR Manager</td>
                      </tr>
                      <tr>
                        <td>#1456</td>
                        <td>John</td>
                        <td>Smith</td>
                        <td>Developer</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Graph Section -->
              <div class="col-12 col-lg-6">
                <div class="card shadow-sm p-3">
                  <div
                    class="d-flex justify-content-between align-items-center"
                  >
                    <h5 class="card-title">Sales Chart</h5>
                    <div class="btn-group">
                      <button
                        class="btn btn-outline-dark active"
                        onclick="changeGraph('3T9EF')"
                      >
                        Daily
                      </button>
                      <button
                        class="btn btn-outline-dark"
                        onclick="changeGraph('p_kpmum5a1qd')"
                      >
                        Weekly
                      </button>
                      <button
                        class="btn btn-outline-dark"
                        onclick="changeGraph('p_kwszf4a1qd')"
                      >
                        Monthly
                      </button>
                    </div>
                  </div>

                  <!-- Graph Frame -->
                  <iframe
                    id="graphFrame"
                    width="100%"
                    height="300"
                    src="https://lookerstudio.google.com/embed/reporting/21ae1fd8-bf1f-421b-a0ed-a9b94d3b3918/page/3T9EF"
                    frameborder="0"
                    style="border: 0"
                    allowfullscreen
                    sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
                  >
                  </iframe>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
