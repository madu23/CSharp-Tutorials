<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar__logo">
          <img src="Images/logo.png" alt="Logo" />
        </div>

        <button class="menu active">
          <img src="Images/dashboard-icon.svg" alt="Dashboard" />
          <span>Dashboard</span>
          <img src="Images/dropdown.svg" class="dropdown-icon" />
        </button>

        <button class="menu">
          <img src="Images/food-icon.svg" alt="Menu" />
          <span>Menu</span>
          <img src="Images/dropdown.svg" class="dropdown-icon" />
        </button>

        <button class="menu">
          <img src="Images/customer-icon.svg" alt="Customer" />
          <span>Customer</span>
          <img src="Images/dropdown.svg" class="dropdown-icon" />
        </button>

        <button class="menu">
          <img src="Images/order-icon.svg" alt="Order" />
          <span>Order</span>
          <img src="Images/dropdown.svg" class="dropdown-icon" />
        </button>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <nav class="navbar">
          <input type="text" class="search-bar" placeholder="Search Employee ID" />
          <div class="nav-icons">
            <img src="Images/Notification.svg" alt="Notification" />
            <img src="Images/profile.jpg" alt="Profile" class="profile-icon" />
          </div>
        </nav>

        <section class="hero">
          <!-- Cards -->
          <div class="cards">
            <div class="card">
              <img src="Images/orders-icon.svg" alt="Orders" />
              <span>Total Orders</span>
              <span>1750</span>
            </div>
            <div class="card">
              <img src="Images/delivered-icon.svg" alt="Delivered" />
              <span>Total Delivered</span>
              <span>567</span>
            </div>
            <div class="card">
              <img src="Images/revenue-icon.svg" alt="Revenue" />
              <span>Total Revenue</span>
              <span>N1,290,750</span>
            </div>
            <div class="card">
              <img src="Images/menu-icon.svg" alt="Food" />
              <span>Total Menu</span>
              <span>125</span>
            </div>
          </div>

          <!-- Table & Graph -->
          <div class="dashboard-content">
            <div class="order-table">
              <h3>Employee Details</h3>
              <table>
                <tr>
                  <th>ID</th>
                  <th>First Name</th>
                  <th>Last Name</th>
                  <th>Designation</th>
                </tr>
                <tr>
                  <td>#1454</td>
                  <td>Oluwafunmilayo</td>
                  <td>Lemboye</td>
                  <td>System Admin</td>
                </tr>
                <tr>
                  <td>#1454</td>
                  <td>Oluwafunmilayo</td>
                  <td>Lemboye</td>
                  <td>System Admin</td>
                </tr>
                <tr>
                  <td>#1454</td>
                  <td>Oluwafunmilayo</td>
                  <td>Lemboye</td>
                  <td>System Admin</td>
                </tr>
              </table>
            </div>
            <div class="graph">
              <div class="graph-header">
                <h3>Daily Sales Chart</h3>
                <div class="toggle">
                  <button class="toggle-btn active">Monthly</button>
                  <button class="toggle-btn">Weekly</button>
                  <button class="toggle-btn">Today</button>
                </div>
              </div>
              <img src="Images/graph.png" alt="Graph" />
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
