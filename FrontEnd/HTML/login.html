<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class=" container-fluid bg-image position-relative d-flex justify-content-center align-items-center">
    <div class="position-absolute top-0 start-0 m-3">
  
          <img src="Images/Logo.png" class="img-fluid" style="max-height: 80px;" alt="Logo">

      </div>
    <div class="position-absolute top-0 start-0 w-100 h-100" style="background: rgba(0, 0, 0, 0.5);"></div>
    <div class="card-body position-relative p-4">
      <h3 class="card-title text-center mb-2">Login</h3>
      <p class="text-center mb-5">Welcome to Our Restaurant</p>
      <form id="login-box">
        <div class="mb-3 row">
            <label for="username" class="col-form-label">Username</label>
            <div class="">
              <input type="text" class="form-control" id="login-username" placeholder="Enter your username">
            </div>        
        </div>
        <div class="mb-3 row">
            <label for="password" class="col-form-label">Password</label>
            <div class="">
              <input type="password" class="form-control" id="login-password" placeholder="Enter your password">
            </div>        
        </div>
        <div class="d-grid gap-2 mt-5">
          <button class="btn btn-primary" type="submit">Login</button>
          <button class="btn bg-transparent border-0">Don't have an account? <span class="btn-link">Create an account</span></button>
        </div>
        <div id="login-alert" class="alert d-none mt-3" role="alert"></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="login.js"></script>
</body>
</html>
