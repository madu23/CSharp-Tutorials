<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login :: Mama Put</title>
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Custom Styles -->
    <link rel="stylesheet" href="assets/css/styles.css" />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>
  <body
    style="
      background-image: url('assets/img/delicious-food-buffet.jpg');
      background-size: cover;
      background-position: center;
    ">
    <!-- Preloader -->
    <div class="loading-wave" id="preloader">
      <div class="loading-bar"></div>
      <div class="loading-bar"></div>
      <div class="loading-bar"></div>
      <div class="loading-bar"></div>
    </div>

    <!-- Responsive container -->
    <div
      class="container vh-100 d-flex justify-content-center align-items-center">
      <div class="login-box p-4 rounded larger-login-box shadow">
        <div class="text-center mb-4">
          <div class="m-logo">
            <img
              src="assets/img/gold-pot.png"
              alt="Mama Put Logo"
              class="img-fluid justify-content-center align-items-center" />
            <span>Mama Put</span>
          </div>
        </div>
        <form id="loginForm">
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input
              type="text"
              id="username"
              class="form-control"
              placeholder="Username"
              required />
          </div>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Password"
              required />
          </div>
          <button type="submit" class="btn btn-primary w-100">LOGIN</button>
          <div class="err mt-3">
            <p id="errorMessage"></p>
          </div>
        </form>
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
  </body>
</html>
